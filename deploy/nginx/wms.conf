# =============================================================
# WMS 前端 Nginx 配置
# 放置位置：ECS 上 /opt/wms/nginx/wms.conf
# 挂载到容器：/etc/nginx/conf.d/default.conf
#
# 作用：托管 Vue 构建产物（静态文件） + 把 /api 请求转发给后端容器
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限（以后加 Excel 批量导入功能时用得上）
    client_max_body_size 20m;

    # 隐藏版本号：公网上不暴露 nginx 具体版本，减少被针对扫描的风险
    server_tokens off;

    # ---------- 压缩 ----------
    gzip on;
    # 关键：Vite 构建时已生成 .gz 文件（vite-plugin-compression），
    # 打开 gzip_static 后 Nginx 直接返回现成的压缩文件，不再实时压缩，省 CPU
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml image/svg+xml;

    # =====================================================
    # 健康检查端点（供容器探针与巡检脚本使用）
    #
    # 为什么要单独开一个：端口通 ≠ 服务可用。
    # 后端线程池打满或数据库连接不上时，8080 端口照样在监听，
    # 只有这个端点会因为 DB 不通而返回 DOWN。
    # access_log off：探针 30 秒一次，不关的话访问日志会被探针刷满。
    # =====================================================
    location = /actuator/health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $wms_health_backend http://wms-server:8080;
        proxy_pass $wms_health_backend;
        access_log off;
    }

    # =====================================================
    # API 反向代理：/api/xxx -> http://wms-server:8080/api/xxx
    #
    # 因为后端接口本身就以 /api 开头，所以这里【不需要 rewrite】，
    # 原样转发即可。前端 axios 的 baseURL 留空走同源请求，天然没有跨域问题。
    # =====================================================
    location /api/ {
        # 用 Docker 内置 DNS + 变量形式的 proxy_pass：
        # 避免 nginx 启动时因为后端还没就绪而直接报错退出（"host not found in upstream"）
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $wms_backend http://wms-server:8080;
        proxy_pass $wms_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # =====================================================
    # 静态资源缓存策略
    # =====================================================

    # 带内容哈希的构建产物：内容变了文件名就变了，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 绝对不缓存：否则你发新版本后，用户浏览器还在用旧页面，
    # 表现为「功能改了但用户说没生效」，是部署后最常见的投诉来源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Vue Router history 模式：刷新 /inventory 这类前端路由时，
    # 服务器上并不存在该文件，需要 fallback 回 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 服务器内部错误页
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
