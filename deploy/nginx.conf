# =====================================================================
# WMS 生产部署 Nginx 配置（08-运维）
#
# 组成：
#   前端静态资源：arco/hello-arco-pro/dist（npm run build 产物）
#   后端服务：    http://127.0.0.1:8080（java -jar springBoot/target/wms-server.jar）
#
# 前端 .env.production 为空，所有请求走相对路径 /api，由本配置反代到后端。
#
# 使用方式：
#   本文件只包含 server 块，需放入 nginx 的 http 块中：
#     - Windows：复制到 <nginx>/conf/conf.d/wms.conf，
#       并在 conf/nginx.conf 的 http {} 内加一行  include conf.d/*.conf;
#     - Linux：  放到 /etc/nginx/conf.d/wms.conf（root 路径需同步修改）
#   校验并重载：nginx -t && nginx -s reload
# =====================================================================

server {
    listen       80;
    server_name  localhost;    # TODO(08-运维): 改为实际域名或服务器 IP

    # 请求体上限（单据提交、未来附件上传）
    client_max_body_size 20m;

    # ---------------- 后端 API 反代 ----------------
    # 后端接口统一以 /api 开头，proxy_pass 不带 URI 部分以保留原路径
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ---------------- 前端静态资源 ----------------
    # Windows 路径用正斜杠；部署到 Linux 时改为对应目录
    root  d:/Documents/wby/Java/WMS/arco/hello-arco-pro/dist;
    index index.html;

    # dist 产物已含 .gz 预压缩文件（vite 构建生成），直接启用免实时压缩
    gzip_static on;

    # 带内容 hash 的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history 路由回退：前端路由刷新不致 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
